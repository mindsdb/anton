[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "anton-agent"
dynamic = ["version"]
description = "Autonomous coding copilot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "MindsDB Inc", email = "admin@mindsdb.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=1.0",
    # >=3.0 also keeps the async API-key supplier contract that arrived in 2.21
    # (ENG-2116 depends on it).
    "openai>=3.0",
    # Declared, not inherited: it arrived transitively via anthropic/openai.
    # Same range those SDKs require, so the client we hand them matches theirs.
    "httpx2>=2.7,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12.4",
    "rich>=13.0,<15",
    "prompt-toolkit>=3.0",
    "packaging>=21.0",
    "pyyaml>=6.0",
    "dill==0.3.8",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
clipboard = [
    "Pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/mindsdb/anton"
Repository = "https://github.com/mindsdb/anton"
Issues = "https://github.com/mindsdb/anton/issues"

[project.scripts]
anton = "anton.cli:app"

[tool.hatch.version]
source = "vcs"
fallback-version = "2.0.0-dev"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "stub_only: test requires stub server (skipped when --live is passed)",
    "slow: test spawns a real scratchpad venv/subprocess (seconds)",
]

 [tool.hatch.build.targets.wheel]
    packages = ["anton", "anton_state"]
