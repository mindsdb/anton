name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, docs-v1]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Build site
        working-directory: docs
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    # Alert the eng channel if the docs build or Pages deploy fails.
    needs: [build, deploy]
    if: failure()
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "docs deploy"
      runs-on: ubuntu-latest
    secrets: inherit


  notify-recovery:
    # Post a green "recovered" message when the pipeline goes green after a
    # failing run (the reusable no-ops on a normal green run).
    needs: [build, deploy]
    if: success()
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "docs deploy"
      status: recovered
      runs-on: ubuntu-latest
    secrets: inherit
