name: CI

permissions:
  contents: read

# Unit + stub-e2e validation. Runs directly on pull requests, and is CALLED as a
# reusable (workflow_call) by the release publishers — release.yml on main and
# publish-staging.yml on staging — so a branch push validates exactly once,
# inside the release run tree, instead of as a second disconnected push run.
# Failure notification lives in the calling publisher, not here (mirrors the
# cowork-server tests-unit.yml reusable pattern).
on:
  pull_request:
    branches: [main, staging]
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # A test that hangs fails the job here instead of at GitHub's 6-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"

      - name: Set up Python
        run: uv python install 3.12

      - name: Check uv.lock matches pyproject.toml
        # Snyk scans the lockfile, so a lockfile behind pyproject.toml means
        # Snyk is reporting on dependencies we no longer install.
        run: uv lock --check

      - name: Run unit tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: uv run --locked --group dev pytest tests/ -v --ignore=tests/e2e --shard-index "$SHARD_INDEX" --shard-count 4 --durations=20

      - name: Check exported release dependencies
        run: python scripts/release_contract.py --check

  stub-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
      - name: Set up Python
        run: uv python install 3.12
      - name: Run E2E tests (stub)
        run: uv run --locked --group dev pytest tests/e2e/ -v --durations=20

  sandbox-packages:
    # The scratchpad image installs the `scratchpad` dependency group, and an
    # app backend's venv holds fastapi and mangum; the unit-test jobs have
    # neither. Tests that exercise those packages skip without them, so they
    # run here, with the packages installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
      - name: Set up Python
        run: uv python install 3.12
      - name: Run tests that need the sandbox packages
        env:
          ANTON_REQUIRE_SANDBOX_PACKAGES: "1"
        run: uv run --locked --group dev --group scratchpad pytest tests/test_reading_files_skill.py tests/test_image_smoke.py -v -rs
      - name: Run the backend verifier tests, which need fastapi and mangum
        env:
          ANTON_REQUIRE_SANDBOX_PACKAGES: "1"
        run: uv run --locked --group dev --with fastapi==0.162.0 --with mangum==0.22.0 pytest tests/test_artifact_verify_backend.py -v -rs

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
      - name: Set up Python
        run: uv python install 3.12
      - name: Check PowerShell release installation
        run: uv run --locked --group dev pytest tests/test_release_installers.py -k powershell -v
      - name: Check a cell's environment on Windows
        run: uv run --locked --group dev pytest tests/test_agent_env.py tests/test_cell_env.py -v -rs

      - name: Check a project's .anton folder is owner-only
        run: uv run --locked --group dev pytest tests/test_workspace_private.py -v -rs

  # Preserve the required check name, and fail even if a dependency was skipped.
  run-tests:
    if: always()
    needs: [unit-tests, stub-e2e, sandbox-packages, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          E2E_RESULT: ${{ needs.stub-e2e.result }}
          SANDBOX_RESULT: ${{ needs.sandbox-packages.result }}
          WINDOWS_RESULT: ${{ needs.windows-installer.result }}
        run: |
          test "$UNIT_RESULT" = success &&
          test "$E2E_RESULT" = success &&
          test "$SANDBOX_RESULT" = success &&
          test "$WINDOWS_RESULT" = success
