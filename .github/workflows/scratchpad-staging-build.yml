name: Scratchpad image - Staging build on push to main

# Pushes minds-anton-scratchpad as staging-<sha> (plus the moving `staging` and `latest` tags)
# on every push to main. Build + scan only; the scratchpad-controller consumes the tag.

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: mdb-dev
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull MindsDB Github Actions
        uses: actions/checkout@v4
        with:
          repository: mindsdb/github-actions
          path: github-actions
      - uses: ./github-actions/setup-env
      - id: build
        uses: ./github-actions/build-push-ecr
        with:
          module-name: minds-anton-scratchpad
          build-for-environment: staging

  scan:
    runs-on: mdb-dev
    needs: [build]
    name: Scan minds-anton-scratchpad image
    steps:
      - uses: actions/checkout@v4
      - uses: mindsdb/github-actions/snyk-docker-scan@main
        with:
          image: ${{ needs.build.outputs.image }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
