name: Auto-release and publish to PyPI

# Stable release stream: on every push to main, validate, cut a CalVer release,
# verify the built wheel, then publish it to PyPI. Staging pre-releases (rc) live in
# publish-staging.yml so each stream keeps its own run tree, permissions,
# notifications, and publishing identity.
#
# The publish job MUST live in this top-level workflow — PyPI Trusted Publishing
# does not support reusable workflows and matches the OIDC claim on THIS
# filename. Register release.yml as a trusted publisher (environment `pypi`) at
# https://pypi.org/manage/project/anton-agent/settings/publishing/
#
# No workflow-level `permissions:` block: only the release job needs
# `contents: write`; every other job declares its own, so the repo default
# (read) applies to the rest.
#
# run-tree-ok: PyPI Trusted Publishing binds to this top-level workflow file.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  auto-release:
    needs: unit-tests
    # workflow_dispatch can be pointed at any ref; only main cuts a stable release.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # tag push + release creation
    uses: mindsdb/github-actions/.github/workflows/calver-release.yml@main
    with:
      calver-major: "2"
      runs-on: ubuntu-latest

  verify-wheel:
    needs: auto-release
    permissions:
      contents: read
    uses: ./.github/workflows/tests_e2e_release.yml
    with:
      tag: ${{ needs.auto-release.outputs.tag }}
      version: ${{ needs.auto-release.outputs.version }}
    secrets: inherit

  # The worker image prod scratchpad-controller pulls as
  # minds-anton-scratchpad:production (ENG-2129). Gated on verify-wheel like
  # the PyPI publish: pods pull the moving tag on their next start, so a bad
  # image reaches users as fast as a bad wheel would.
  scratchpad-image:
    needs: [auto-release, verify-wheel]
    permissions:
      contents: read
      id-token: write # the build's ECR role, assumed over OIDC
    uses: ./.github/workflows/scratchpad-dev-build.yml
    with:
      environment: production
      version: ${{ needs.auto-release.outputs.version }}

  publish:
    name: Publish to PyPI
    # Gated on verify-wheel: a PyPI upload cannot be withdrawn.
    needs: [auto-release, verify-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publisher (OIDC)
    steps:
      # Publish the bytes verify-wheel actually tested, not a rebuild of the
      # same source — a second build verifies equivalence, not the artifact.
      - name: Download the verified distributions
        uses: actions/download-artifact@v8
        with:
          name: verified-dist
          path: dist

      - name: Show what is being published
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher (OIDC) — release.yml must be registered at the
        # anton-agent PyPI project's publishing settings (environment: pypi).

  notify-cowork-server:
    # Tells cowork-server that a final anton is on PyPI. Desktop installs exactly
    # the anton cowork-server's lock names, and a production cowork-server release
    # must lock a final, so cowork-server relocks staging to this one as soon as
    # it publishes (its .github/workflows/anton-final-lock.yml). It runs after
    # the upload and cannot affect it. A failure shows in `notify` below, and
    # cowork-server's own periodic check still finds the final later.
    needs: [auto-release, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}  # The App token below does the work; GITHUB_TOKEN is unused.
    steps:
      - name: Mint a release-train App token for cowork-server
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mindsdb
          repositories: cowork-server
          permission-contents: write  # what a repository_dispatch requires

      - name: Send anton-final-published to cowork-server
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.auto-release.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method POST repos/mindsdb/cowork-server/dispatches \
            -f event_type=anton-final-published \
            -f "client_payload[version]=${VERSION}"
          echo "Sent anton-final-published for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  notify:
    # Alert the eng channel if ANY job in the release pipeline fails (tests, tag,
    # wheel verification, PyPI publish, or the cowork-server notice).
    # One job covers both outcomes: a `uses:` job cannot branch on status, so
    # the aggregate result picks the failed or recovered message, and a
    # cancelled run stays silent.
    needs: [unit-tests, auto-release, verify-wheel, scratchpad-image, publish, notify-cowork-server]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      actions: read  # the prior-run lookup behind the recovery message
    uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@main
    with:
      env-name: "release"
      status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
      runs-on: ubuntu-latest
    secrets: inherit
