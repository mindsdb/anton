name: Scratchpad image - Dev build on PR

# Builds and pushes the minds-anton-scratchpad image (the sandbox pod image) to ECR as
# development-<sha> when a PR carries a deploy label. The scratchpad-controller references
# the resulting tag via SCRATCHPAD_CONTROLLER__SCRATCHPAD_IMAGE; there is no Helm chart for
# this image, so this workflow only builds and scans (no deploy job).

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:

  get-deploy-labels:
    runs-on: mdb-dev
    outputs:
      deploy-envs: ${{ steps.get-labels.outputs.deploy-envs }}
    steps:
      - name: Pull MindsDB Github Actions
        uses: actions/checkout@v4
        with:
          repository: mindsdb/github-actions
          path: github-actions
      - id: get-labels
        uses: ./github-actions/get-deploy-labels

  build:
    runs-on: mdb-dev
    needs: [get-deploy-labels]
    if: needs.get-deploy-labels.outputs.deploy-envs != '[]'
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull MindsDB Github Actions
        uses: actions/checkout@v4
        with:
          repository: mindsdb/github-actions
          path: github-actions
      - uses: ./github-actions/setup-env
      - id: build
        uses: ./github-actions/build-push-ecr
        with:
          # Override the repo-slug default so the image lands at .../minds-anton-scratchpad.
          module-name: minds-anton-scratchpad
          build-for-environment: development

  scan:
    runs-on: mdb-dev
    needs: [build]
    name: Scan minds-anton-scratchpad image
    steps:
      - uses: actions/checkout@v4
      - uses: mindsdb/github-actions/snyk-docker-scan@main
        with:
          image: ${{ needs.build.outputs.image }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
