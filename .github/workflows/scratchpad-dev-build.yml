name: Scratchpad image build

# Builds and pushes the anton scratchpad image (the sandbox pod image) to ECR.
# Two ways in:
#
#   - Every pull request whose branch lives in this repository builds for the
#     `development` environment. No label is required and none is checked:
#     `labeled` sits in the trigger list so that adding one rebuilds.
#   - release.yml and publish-staging.yml call this workflow after they mint a
#     tag, building for `production` and `staging` respectively (ENG-2129).
#
# The build runs on a GitHub-hosted runner and pushes with a short-lived AWS
# role it assumes through GitHub OIDC. The gate job's `target` step picks the
# GitHub environment, the role and the ECR repository for each way in: pull
# requests and staging push to minds-anton-scratchpad-dev, and only a
# production build from main pushes to minds-anton-scratchpad.
#
# The shared build-push-ecr action tags every build `<env>-<sha>`,
# `<env>-head-<pr head sha>` (pull requests only), the moving `<env>` tag, and
# `latest`, all in that build's repository. scratchpad-controller points each
# environment's SCRATCHPAD_CONTROLLER__SCRATCHPAD_IMAGE at the moving tag and
# pulls with imagePullPolicy Always, so a release reaches worker pods without
# anyone editing a sha into a values file. There is no Helm chart for this
# image, so this workflow only builds (no deploy job).
#
# The image is smoke-tested inside the build, not here: the Dockerfile's last layer runs
# docker/image_smoke.py as UID 1000, which executes both entrypoints the controller execs.
# It sits in the build rather than in a step below it so a failure blocks the PUSH — an
# image no pod can serve a turn with never reaches ECR to be pinned by mistake.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_call:
    inputs:
      environment:
        description: "build-push-ecr environment: staging or production. Pull requests build development."
        type: string
        required: true
      version:
        description: "The anton version the image reports; the tag the caller just minted."
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  # Who may build and push the image: pull requests from branches in this
  # repository, and calls from the release pipelines. Anything else is refused
  # with a run-summary line saying why.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      environment: ${{ steps.target.outputs.environment }}
      role: ${{ steps.target.outputs.role }}
      repository: ${{ steps.target.outputs.repository }}
    steps:
      - name: Decide whether this run may build
        id: decide
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          # Empty on every event except a workflow_call from a release pipeline.
          CALLED_FOR: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ -n "${CALLED_FOR:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_PR" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Build skipped: this run is not a pull request"
              echo
              echo "The gate decides from the pull request payload, and this event carries"
              echo "none, so it cannot tell whose branch it is about to build."
              echo "Whoever added this trigger needs to say how the gate should read it."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Build skipped: fork pull request"
              echo
              echo "The scratchpad image build pushes to our container registry with"
              echo "an AWS role, so it does not build code from a fork. Nothing is"
              echo "wrong with this pull request."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # One row per way in. Which role a job can assume follows from the
      # environment it names, because the trust policies on the
      # gha-anton-ecr-dev and gha-anton-ecr-prod IAM roles (mindsdb/terraform)
      # match the OIDC subject and ref. A pull request names no environment,
      # so its token carries the pull_request subject, which only the dev role
      # trusts. The prod role trusts only the prod environment on main, and
      # the prod environment admits only main.
      - name: Pick the environment, role and repository for this build
        id: target
        env:
          # Empty on every event except a workflow_call from a release pipeline.
          CALLED_FOR: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "${CALLED_FOR:-}" in
            "")
              environment=""
              role="arn:aws:iam::168681354662:role/gha-anton-ecr-dev"
              repository="minds-anton-scratchpad-dev"
              ;;
            staging)
              environment="staging"
              role="arn:aws:iam::168681354662:role/gha-anton-ecr-dev"
              repository="minds-anton-scratchpad-dev"
              ;;
            production)
              environment="prod"
              role="arn:aws:iam::168681354662:role/gha-anton-ecr-prod"
              repository="minds-anton-scratchpad"
              ;;
            *)
              echo "::error::no build target for environment '${CALLED_FOR}'"
              exit 1
              ;;
          esac
          {
            echo "environment=$environment"
            echo "role=$role"
            echo "repository=$repository"
          } >> "$GITHUB_OUTPUT"

  # The version the image will report, resolved from tags (ENG-1796).
  #
  # Its own job so the build's checkout stays shallow: .git never enters the
  # docker context (see .dockerignore), so only this job needs the history.
  #
  # A release pipeline passes the version it just minted instead, for the same
  # reason publish-staging.yml pins SETUPTOOLS_SCM_PRETEND_VERSION: a re-run on
  # an already-tagged head leaves two tags on one commit, and `git describe`
  # would resolve the older. The shape checks below run on both paths.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.version == ''
        with:
          # hatch-vcs derives the version by describing against tags, and the
          # default fetch-depth of 1 fetches none of them.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: inputs.version == ''
        with:
          python-version: "3.12"
      - id: resolve
        name: Resolve the anton version from tags
        env:
          PINNED_VERSION: ${{ inputs.version }}
        # The image reported a hardcoded 2.0.0 until 2026-08-26, so a pod turn
        # could not say which anton served it and bumping the image pin produced
        # no observable change at all.
        #
        # `hatch version` prints the version to stdout and its progress to
        # stderr, so the capture is exactly the version. The shape check is a
        # belt against that ever changing: a malformed value here would be baked
        # into the image and reported by every turn it serves, which is the
        # class of failure this whole change exists to remove. Fail instead.
        run: |
          set -euo pipefail
          # `tail -n 1`: hatch prints progress to stderr today, but a stray line
          # on stdout would otherwise ride along into $GITHUB_OUTPUT, where a
          # second line is parsed as another key=value pair rather than failing.
          version="${PINNED_VERSION:-$(uvx hatch version | tail -n 1)}"

          # Whole-line match, PEP 440 characters only. This is a boundary, not a
          # formatting nicety: the shared action expands `extra-build-args`
          # UNQUOTED into `docker buildx build`, so anything containing
          # whitespace becomes additional arguments to that command.
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9][0-9A-Za-z.!+]*'; then
            echo "::error::refusing to build: '$version' is not a bare PEP 440 version"
            exit 1
          fi

          # Reject the fallback explicitly. With no tags reachable, hatch-vcs
          # resolves `2.0.0.dev1+g<sha>` (and `2.0.0-dev` with no .git at all) —
          # both well-formed, both accepted by the check above, and both the
          # very 2.0.0 family this change exists to eliminate. anton is CalVer,
          # so a 2.0.0 version is never legitimate and always means the tags did
          # not arrive.
          case "$version" in
            2.0.0*)
              echo "::error::'$version' is the hatch-vcs fallback — the checkout has no tags."
              echo "::error::Building would bake a 2.0.0 version back into the image (ENG-1796)."
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "anton version: $version"

  build:
    needs: [version, gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Empty on a pull request, so the job names no environment. The gate's
    # `target` step says why that decides which role the job can assume.
    environment: ${{ needs.gate.outputs.environment }}
    # Both callers grant id-token on the job that calls this workflow, because
    # GitHub fails a caller's whole run before any job starts when a called
    # job names a scope the caller did not grant.
    permissions:
      contents: read
      id-token: write  # mints the OIDC token the ECR writer role is assumed with
    # Job-level rather than workflow-level so it holds when this workflow is
    # called: a pull request cancels its own superseded build; a release build
    # queues behind the previous one for the same environment and is never
    # cancelled, because a half-finished push has already moved nothing but a
    # cancelled one leaves the release without an image.
    concurrency:
      group: scratchpad-image-${{ inputs.environment || github.workflow_ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mindsdb/github-actions/setup-env@main
      - name: Assume the ECR writer role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.gate.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}
      - id: build
        uses: mindsdb/github-actions/build-push-ecr@main
        with:
          # Build with buildx on this runner, using the credentials the step
          # above configured, instead of the in-cluster remote builder.
          builder: local
          # The ECR repository name, which overrides the repo-slug default.
          module-name: ${{ needs.gate.outputs.repository }}
          build-for-environment: ${{ inputs.environment || 'development' }}
          # Expanded unquoted by the shared action, so the value must not contain
          # whitespace — a PEP 440 version never does, and the shape check in the
          # `version` job would have rejected it.
          extra-build-args: --build-arg ANTON_VERSION=${{ needs.version.outputs.version }}
