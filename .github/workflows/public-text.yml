# run-tree-ok: PR metadata edits must rerun this stable text gate without
# retriggering application build or deployment pipelines.
name: Public text

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: public-text-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-text:
    uses: mindsdb/github-actions/.github/workflows/public-text-check.yml@main
    secrets:
      PUBLIC_TEXT_DENYLIST: ${{ secrets.PUBLIC_TEXT_DENYLIST }}
