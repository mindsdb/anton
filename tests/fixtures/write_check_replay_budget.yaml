# The write check's card budget on tests/fixtures/write_check_replay_corpus.yaml,
# read by tests/test_write_check_replay.py::test_the_write_check_keeps_its_card_budget.
# Every list is exact: the test fails, naming the cells, when this tree's
# scorecard differs from it in either direction. Keys are the corpus cells' ids.
#
#   real_writes_carded        real writes the check cards on a rule of its own
#                             (SQL, an SQL file, HTTP or a file action). Never
#                             drop one without its PR saying what holds it now.
#   real_writes_carded_only_unchecked
#                             real writes carded only by the "can't be checked"
#                             card. A change that narrows that card moves each
#                             write it frees to real_writes_missed, and its PR
#                             says what holds that write now.
#   real_writes_missed        real writes the check gives no card: its known
#                             misses. A change that starts catching one moves
#                             it to a carded list.
#   no_write_carded           cells that write nothing and run no unread code,
#                             but get a card. Drop a cell when a change frees
#                             it; add one only with the PR saying why it must ask.
#   broken_pairs              pairs whose hold cell has no card or whose free
#                             cell has one. Drop a pair when a change repairs it.

