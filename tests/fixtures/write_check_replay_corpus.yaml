      import requests


      class PlanningClient:
          def __init__(self, base='https://erp.example.test', timeout=60):
              self.base = base.rstrip('/')
              self.timeout = timeout
              self.s = requests.Session()

          def get(self, path, **params):
              r = self.s.get(self.base + path, params=params, timeout=self.timeout)
              r.raise_for_status()
              return r.json()

          def drafts(self):
              return self.get('/drafts')

          def plan(self, draft, horizon=12):
              return self.get('/plan', draft=draft, horizon=horizon)

          def exceptions(self, draft):
              return self.get('/exceptions', draft=draft)

          def apply(self, draft, change):
              r = self.s.post(self.base + '/api/changes', json={'draft': draft, 'change': change}, timeout=self.timeout)
              r.raise_for_status()
              return r.json()
