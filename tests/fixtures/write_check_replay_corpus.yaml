      import json
      import requests

      GW = 'https://erp.example.test'

      def gw_get(path, **params):
          r = requests.get(GW + path, params=params, timeout=60)
          r.raise_for_status()
          return r.json()

      def create_draft(name, base='BASE'):
          r = requests.post(GW + '/api/drafts', json={'name': name, 'from': base}, timeout=120)
          r.raise_for_status()
          return r.json()

      def apply_change(draft, change):
          r = requests.post(GW + '/api/changes', data=json.dumps({'draft': draft, 'change': change}),
                            headers={'Content-Type': 'application/json'}, timeout=120)
          r.raise_for_status()
          return r.json()
