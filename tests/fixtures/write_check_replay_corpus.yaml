- name: A05 demand forecast
  style: pandas
  files:
    data/weekly_demand.csv: |
      week,sku,units
      2025-01-06,SKU-1,120
  cells:
  - id: A05.0
    code: |-
      import pandas as pd
      dem = pd.read_csv('data/weekly_demand.csv', parse_dates=['week'])
      total = dem.groupby('week')['units'].sum().asfreq('W-MON').fillna(0)
      print(total.tail(10))
      print(len(total), 'weeks')
    real_write: false
  - id: A05.1
    code: |-
      from statsmodels.tsa.seasonal import seasonal_decompose
      dec = seasonal_decompose(total, model='additive', period=52)
      print(dec.seasonal.head(8).round(1))
      print('trend change over last 26w:', round(dec.trend.dropna().iloc[-1] - dec.trend.dropna().iloc[-27], 1))
    real_write: false
  - id: A05.2
    code: |-
      from statsmodels.tsa.holtwinters import ExponentialSmoothing
      ets = ExponentialSmoothing(total, trend='add', seasonal='add', seasonal_periods=52).fit()
      fc = ets.forecast(12)
      print(fc.round(0))
    real_write: false
  - id: A05.3
    code: |-
      import numpy as np
      errors = []
      for k in range(8, 0, -1):
          train = total.iloc[:-k]
          actual = total.iloc[-k]
          pred = ExponentialSmoothing(train, trend='add', seasonal='add', seasonal_periods=52).fit().forecast(1).iloc[0]
          errors.append(abs(pred - actual) / max(actual, 1))
      print('backtest MAPE', round(100 * np.mean(errors), 1), '%')
    real_write: false
  - id: A05.4
    code: |-
      import matplotlib.pyplot as plt
      fig, ax = plt.subplots(figsize=(10, 4))
      total.iloc[-52:].plot(ax=ax, label='actual')
      fc.plot(ax=ax, label='forecast', linestyle='--')
      ax.legend()
      fig.savefig('demand_forecast.png', bbox_inches='tight')
    real_write: false
  - id: A05.5
    code: |-
      def sku_forecast(frame, sku, horizon=12):
          s = frame[frame['sku'] == sku].set_index('week')['units'].asfreq('W-MON').fillna(0)
          if len(s) < 104:
              return pd.Series([s.tail(8).mean()] * horizon)
          return ExponentialSmoothing(s, trend='add', seasonal='add', seasonal_periods=52).fit().forecast(horizon)

      top_skus = dem.groupby('sku')['units'].sum().nlargest(5).index
      per_sku = {sku: sku_forecast(dem, sku).round(0).tolist() for sku in top_skus}
      for sku, values in per_sku.items():
          print(sku, values[:4], '...')
    real_write: false
  - id: A05.6
    code: |-
      out = pd.DataFrame(per_sku)
      out.index = pd.date_range(total.index[-1] + pd.Timedelta(weeks=1), periods=12, freq='W-MON')
      out.to_csv('forecast_next_12w.csv')
      print(out.head())
    real_write: false
  - id: A05.7
    code: print(out.sum().sort_values(ascending=False).to_frame('units_12w'))
    real_write: false
  - id: A05.8
    code: |-
      naive = total.shift(52).iloc[-12:]
      print('naive seasonal MAPE', round(100 * ((naive - total.iloc[-12:]).abs() / total.iloc[-12:].clip(lower=1)).mean(), 1))
    real_write: false
