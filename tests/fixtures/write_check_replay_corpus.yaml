      import numpy as np
      import pandas as pd


      def describe_series(s):
          s = pd.Series(s).dropna()
          return {'n': int(s.size), 'mean': float(s.mean()), 'sd': float(s.std()),
                  'p50': float(s.median()), 'p95': float(s.quantile(0.95))}


      def flag_outliers(df, col, k=3.0):
          z = (df[col] - df[col].mean()) / df[col].std()
          return df[z.abs() > k]


      def trend(s):
          x = np.arange(len(s))
          return float(np.polyfit(x, np.asarray(s, dtype=float), 1)[0])
