      import os
      import pandas as pd
      from databricks import sql as dbsql

      _conn = None

      def connect():
          global _conn
          if _conn is None:
              _conn = dbsql.connect(server_hostname=os.environ['DS_DATABRICKS_PLANNING__SERVER_HOSTNAME'],
                                    http_path=os.environ['DS_DATABRICKS_PLANNING__HTTP_PATH'],
                                    access_token=os.environ['DS_DATABRICKS_PLANNING__ACCESS_TOKEN'])
          return _conn

      def query(sql):
          with connect().cursor() as cur:
              cur.execute(sql)
              return pd.DataFrame(cur.fetchall(), columns=[c[0] for c in cur.description])

      def sample_record():
          return query("SELECT * FROM main.supply.orders LIMIT 1").iloc[0].to_dict()
