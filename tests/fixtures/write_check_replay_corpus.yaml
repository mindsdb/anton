      from scipy.stats import norm

      def safety_stock(demand_mean, demand_sd, lead_mean, lead_sd, service=0.95):
          z = norm.ppf(service)
          return z * np.sqrt(lead_mean * demand_sd ** 2 + demand_mean ** 2 * lead_sd ** 2)

      print(round(safety_stock(40, 12, 18, 4), 1))
