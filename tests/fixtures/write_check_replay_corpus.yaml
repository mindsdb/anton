  - id: A04.1
    code: |-
      X = pd.get_dummies(cust.drop(columns=['customer_id', 'churned']), columns=['plan'], drop_first=True)
      y = cust['churned']
      X['tickets_per_order'] = X['tickets_12m'] / X['orders_12m'].clip(lower=1)
      print(X.describe().T)
    real_write: false
  - id: A04.2
