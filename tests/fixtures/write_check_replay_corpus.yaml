# Synthetic analysis chats a data-analysis agent has, replayed cell by cell
# through the write check by scripts/write_check_replay.py. Each cell is
# labeled by hand:
#
#   id           the cell's key in scorecards and the budget, unique across
#                the corpus: the chat's code and a number. A new cell takes the
#                chat's next free number, so no other cell's key moves.
#   real_write   it changes a database, sends a request the rule below lists
#                (or a PUT, PATCH or DELETE), or overwrites, deletes or renames
#                a file that was in the project when the turn began and no
#                earlier cell of the chat wrote. So is a startup hook written
#                where the pad's Python reads it (a .pth in site-packages,
#                sitecustomize or usercustomize): every later start of that
#                Python runs it, the restart and the artifact verifier's checks
#                alike. A new file, an overwrite of the agent's own file, an
#                in-memory database and printed SQL text are not real writes.
#   runs_unread  it runs code the check can't read (exec of a file,
#                exec_module, runpy, a module a cell wrote); the product holds
#                it, so a card there is expected even when nothing is written.
#   turn_start   the first cell of a later turn. The host closes the pad at
#                every turn end, so the cell before it ended its process.
#   errored      it stopped on an error.
#   pair, role   a must-hold cell (role: hold) and the must-stay-free cells
#                (role: free) that share its pair id. A fix that frees a free
#                cell must keep its hold cell's card.
#
# Each chat runs in its own project folder holding its `files`, with that
# folder as the working directory. {ROOT} in a cell is the folder and {TMP} a
# second folder outside it. A file spec {gen: <kind>, bytes: <n>} is generated
# text of about that size (see write_check_replay.py's _generated_text).

rule: POST https://erp.example.test/**
chats:
