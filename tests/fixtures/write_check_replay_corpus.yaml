      coefs = pd.Series(model[-1].coef_[0], index=X.columns).sort_values()
      fig, ax = plt.subplots(figsize=(7, 5))
      coefs.plot.barh(ax=ax)
      ax.set_title('Logistic regression coefficients')
      fig.tight_layout()
      fig.savefig('churn_coefficients.png')
      print(coefs)
    real_write: false
