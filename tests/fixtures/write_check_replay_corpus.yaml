      import logging
      import os

      import pandas as pd
      from databricks import sql as dbsql

      log = logging.getLogger('pipeline')
      _conn = None


      def connect():
          global _conn
          if _conn is None:
              _conn = dbsql.connect(server_hostname=os.environ['DS_DATABRICKS_PLANNING__SERVER_HOSTNAME'],
                                    http_path=os.environ['DS_DATABRICKS_PLANNING__HTTP_PATH'],
                                    access_token=os.environ['DS_DATABRICKS_PLANNING__ACCESS_TOKEN'])
          return _conn


      def read_table(name, where=None, limit=None):
          sql = f'SELECT * FROM {name}'
          if where:
              sql += f' WHERE {where}'
          if limit:
              sql += f' LIMIT {int(limit)}'
          log.debug(sql)
          with connect().cursor() as cur:
              cur.execute(sql)
              return pd.DataFrame(cur.fetchall(), columns=[c[0] for c in cur.description])


      def close():
          global _conn
          if _conn is not None:
              _conn.close()
              _conn = None
