  cells:
  - id: A03.0
    code: |-
      import pandas as pd
      stock = pd.read_csv('stock.csv')
      receipts = pd.read_csv('data/receipts.csv')
      print(stock.shape, receipts.shape)
      print(stock.head())
    real_write: false
  - id: A03.1
    code: |-
      from datetime import date
      stock['received_date'] = pd.to_datetime(stock['received_date'], errors='coerce')
      bad = stock['received_date'].isna().sum()
      print('unparseable dates:', bad)
      stock['age_days'] = (pd.Timestamp(date(2026, 11, 12)) - stock['received_date']).dt.days
      stock['bucket'] = pd.cut(stock['age_days'], [-1, 30, 90, 180, 365, 10_000],
                               labels=['0-30', '31-90', '91-180', '181-365', '365+'])
      print(stock['bucket'].value_counts().sort_index())
    real_write: false
  - id: A03.2
    code: |-
      stock['value'] = stock['qty'] * stock['unit_cost']
      for site, g in stock.groupby('site'):
          aged = g[g['age_days'] > 180]
          print(f"{site}: {len(g)} lines, {len(aged)} aged >180d, value at risk {aged['value'].sum():,.0f}")
    real_write: false
  - id: A03.3
    code: |-
      class AgingReport:
          def __init__(self, frame, threshold=180):
              self.frame = frame
              self.threshold = threshold

          def aged(self):
              return self.frame[self.frame['age_days'] > self.threshold]

          def by_site(self):
              return self.aged().groupby('site')['value'].sum().sort_values(ascending=False)

      report = AgingReport(stock)
      print(report.by_site().head(10))
    real_write: false
  - id: A03.4
    code: |-
      from dataclasses import dataclass

      @dataclass
      class Policy:
          slow_days: int = 90
          obsolete_days: int = 365

      pol = Policy()
      stock['class'] = 'active'
      stock.loc[stock['age_days'] > pol.slow_days, 'class'] = 'slow'
      stock.loc[stock['age_days'] > pol.obsolete_days, 'class'] = 'obsolete'
      print(stock.groupby('class')['value'].agg(['count', 'sum']))
    real_write: false
  - id: A03.5
    code: |-
      import matplotlib.pyplot as plt
      tab = stock.pivot_table(index='site', columns='bucket', values='value', aggfunc='sum', fill_value=0, observed=False)
      ax = tab.plot(kind='bar', stacked=True, figsize=(10, 5))
      ax.set_ylabel('Inventory value')
      plt.tight_layout()
      plt.savefig('aging_by_site.png')
      print('saved')
    real_write: false
