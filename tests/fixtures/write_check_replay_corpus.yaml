      def table_html(df, title=''):
          return f'<h2>{_html.escape(title)}</h2>' + df.to_html(index=False, border=0)


      def page(sections, title):
          body = '\n'.join(sections)
          return (f'<!doctype html><html><head><meta charset="utf-8"><title>{_html.escape(title)}</title>'
                  f'<style>{CSS}</style></head><body><h1>{_html.escape(title)}</h1>{body}</body></html>')
