<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Sky</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1026; overflow: hidden; }
  #sky { display: block; width: 100vw; height: 100vh; }
  .caption { position: fixed; bottom: 16px; left: 16px; color: #c9d4ff; font: 14px system-ui, sans-serif; }
  .moon { position: fixed; top: 48px; right: 64px; width: 72px; height: 72px; border-radius: 50%;
          background: #f6f1d5; box-shadow: 0 0 24px #f6f1d5; animation: moon-breathe 6s ease-in-out infinite; }
  @keyframes moon-breathe { 50% { box-shadow: 0 0 40px #f6f1d5; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="moon" id="moon"></div>
<p class="caption" id="caption">Goodnight, sky.</p>
<script>
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const STAR_COUNT = 180;
  const STAR_TWINKLE_SPEED = 0.04;
  const UNICORN_SPEED = 1.6;
  let stars = [];
  let unicorns = [];

  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    stars = Array.from({ length: STAR_COUNT }, () => ({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.3, phase: Math.random() * Math.PI * 2,
    }));
  }

  function spawnUnicorns() {
    unicorns = [0, 1, 2].map(i => ({ x: -120 - i * 260, y: 120 + i * 90, bob: Math.random() * Math.PI }));
  }

  function drawStar(star) {
    star.phase += STAR_TWINKLE_SPEED;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(star.phase);
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawUnicorn(u) {
    u.x += UNICORN_SPEED;
    u.bob += 0.05;
    const y = u.y + Math.sin(u.bob) * 8;
    if (u.x > canvas.width + 120) u.x = -120;
    ctx.save();
    ctx.translate(u.x, y);
    ctx.fillStyle = '#fdf6ff';
    ctx.beginPath(); ctx.ellipse(0, 0, 34, 18, 0, 0, Math.PI * 2); ctx.fill();          // body
    ctx.beginPath(); ctx.ellipse(32, -16, 13, 10, -0.4, 0, Math.PI * 2); ctx.fill();    // head
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.moveTo(38, -26); ctx.lineTo(48, -46); ctx.lineTo(42, -24); ctx.fill(); // horn
    ctx.fillStyle = '#c58bff';
    ctx.beginPath(); ctx.ellipse(-6, -14, 16, 6, -0.6, 0, Math.PI * 2); ctx.fill();     // wing
    ctx.strokeStyle = '#fdf6ff'; ctx.lineWidth = 4;
    for (const leg of [-18, -8, 10, 20]) { ctx.beginPath(); ctx.moveTo(leg, 12); ctx.lineTo(leg, 30); ctx.stroke(); }
    ctx.restore();
  }

  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(drawStar);
    unicorns.forEach(drawUnicorn);
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  spawnUnicorns();
  frame();
</script>
</body>
</html>
