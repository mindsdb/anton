  # A named dict a script runs in stays read only when no other code may
  # change it or an item of it while the script reads it: a store into it,
  # a method of it or of an item, a second exec() into it, a call that hands
  # it on, an item bound to a name the step then changes, a lookup of the
  # cell's namespace under its name or under a key the check can't read,
  # and literal code that names it, each keep the script unread. That holds
  # before the run, after it when the script defines a function that may
  # read the dict later, and in a function's body unless nothing between
  # the dict and the run runs code. Looping over its keys, showing it, and
  # reading an item that is called or shown on the spot do not, and neither
  # does a name or a key that only spells the dict's name elsewhere.

