  # A script the step saves and runs as a file that writes a path the check
  # can't place, as one built from where the script lies, is read as without
  # swaps: the pad's `sys.argv[0]` and `sys.path[0]` lie outside the project,
  # and the script's lie in it, so running the file picks the path. So is a
  # script exec() runs, which may find its file through the name compile()
  # is handed, or through a `sys.argv` or `__file__` other code may set when
  # its text reads a way to one, and so is a write from the line that runs
  # it on, in the step or in a function either calls, or in a function of
  # the step's own that the script or the step from that line on names, and
  # the functions that one calls. So is a later step's write, or a write
  # through a parameter or a loop's target, to a path built from a name
  # such a script left in the pad, when the script's text may reach where
  # its file lies. A read through such a path, a write to None, the null
  # device, a standard stream or a buffer, in a name, a parameter, a dict or
  # a condition, and a script that only prints stay read. So does a write
