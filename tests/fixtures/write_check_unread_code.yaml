  # ── A script the step writes from a literal and runs in the same step ─────
  # With `swaps`, the pad runs the code the check hands it in place of the
  # step's own (`CellWrites.run_code`): Python runs the saved file through `-c`
  # and a prelude that runs it only while it holds the text the check read, and
  # exec() gets the text in place of the name or the read. So the check reads
  # the text as one more cell: a script that only prints
  # runs with no card, and one that writes gets that write's card. Fifteen
  # steps a model wrote when asked to "write and run a script" come first,
  # with the project folder written as <project>. The one that changes folder
  # with os.chdir before it runs the script keeps "can't be checked". Then the
  # writes such a script must keep, and the runs that stay unread: another
  # environment, a shell, more words, a script an earlier step wrote or the
  # project held, an import of a module a step wrote or the project holds,
  # code an earlier step ran that the check couldn't read, a startup hook,
  # multiprocessing, a change of folder, a run inside a def, and a pad that
  # runs the step as written.

