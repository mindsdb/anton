  # ── What the shared reader trusts ─────────────────────────────────────────
  # A store to a member the check's tables name (a delete, a launcher, a
  # listing, a path helper, a tempfile call, an HTTP call, any builtin)
  # changes what a later call of it runs: the cell that stores it is
  # unchecked, and so is a later call of that member in the pad. A store to
  # a member the tables don't name stays read, and so does one whose value
  # does what the member did. An entry of `vars(m)` or `m.__dict__` under a
  # literal key reads as the member. An exec of code the check can't read,
  # in the cell namespace, may define again a function read code defined
  # before it, so a later call of one is held. A step that makes a link and
  # changes a path the link may pass the change through, below it or at it,
  # may change a file the turn began with, so it is unchecked.

