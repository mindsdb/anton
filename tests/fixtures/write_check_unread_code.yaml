  - name: exec of a script reached through a frame's f_builtins from inspect.currentframe
    earlier:
      - SCRIPT = open('job.py').read()
    code: |-
      import inspect
      inspect.currentframe().f_builtins['exec'](SCRIPT)
    card: unchecked

  - name: exec of a literal request reached as a member of a builtin function's __self__
    code: |-
      print.__self__.exec('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: read
    kinds: [http]

  - name: exec of a script named as an entry of a holder the check can't place
    earlier:
      - SCRIPT = open('job.py').read()
    code: |-
      import json
      ops = json.loads(open('ops.json').read())
      ops['exec'](SCRIPT)
