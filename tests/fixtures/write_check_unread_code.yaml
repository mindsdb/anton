# The write check, cell by cell, when a cell runs code the check can't read.
# A missed run sends its request, write or delete with no Approve card; a
# false hold costs an unattended answer the whole card timeout. So each case
# here says what one cell does and the card the check raises for it.
#
# Each case has:
#   name     a short phrase saying what the cell does; the test's id.
#   earlier  the conversation's earlier cells, oldest first (optional).
#   earlier_errored
#            beside `earlier`, true for each earlier cell that stopped on
#            an error (optional).
#   earlier_stopped_at
#            beside `earlier`, the line of its own code each errored cell
#            stopped at, as the pad's boot reads it from the traceback, null
#            where the runtime doesn't say (optional).
#   code     the cell the check runs before it runs for real.
#   files    project files that exist when the turn begins, {path: text}
#            (optional). The snapshot holds stock.csv besides these.
#   empty_project
#            true when the project folder is empty as the turn begins, so
#            the snapshot holds no file at all, not even stock.csv
#            (optional).
#   card     what the check raises:
#              unchecked  the check couldn't read code the cell runs, so it
#                         holds the cell and the card ends "This step can't
#                         be checked before it runs."
#              read       the check read the cell and holds it with the
#                         findings it read; `unchecked` is False.
#              none       the cell runs with no card.
#   kinds    the kinds the card must show besides `unchecked`, e.g. [http]
#            or [sql] (optional).
#   not_kinds
#            kinds the card must not show, e.g. [sql] (optional).
#
# The rule: the check reads literal code it can read; code the cell runs that
# the check can't read makes the cell unchecked; a cell that runs no unread
# code gets a card only for what the check reads in it. The HTTP rule below
# holds any POST to erp.example.test. "The request" throughout is
#   import requests
#   requests.post("https://erp.example.test/api/orders", json={"qty": 1})
#
# Read by tests/test_write_check.py::test_cells_that_run_code_the_check_cant_read,
# which builds a project snapshot in a temp dir (stock.csv, unless
# empty_project, plus `files`), runs find_cell_writes against it, and asserts
# the card named above.

rule: "POST https://erp.example.test/**"

cases:

  # ── Literal and unread code side by side, plus the four-deep control ──────
  # The first two are read; each of the eleven after them runs code the check
  # can't read, so it is unchecked. The last control stays read, since four
  # calls deep is within the read budget.

  - name: plain request written in the cell
    code: |-
      import requests
      requests.post("https://erp.example.test/api/orders", json={"qty": 1})
    card: read
    kinds: [http]

  - name: exec of a literal request
    code: |-
      exec('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: read
    kinds: [http]

  - name: exec compile of a script set in an earlier cell
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      exec(compile(SCRIPT, "job", "exec"))
    card: unchecked

  - name: exec of a script joined from two literals in the same cell
    code: |-
      SCRIPT = 'import requests\n' + 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})'
      exec(SCRIPT)
    card: unchecked

  - name: eval compile of a script
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      eval(compile(SCRIPT, "job", "exec"))
    card: unchecked

  - name: writes job.py then runs it with runpy
    code: |-
      open("job.py", "w").write('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})\n')
      import runpy
      runpy.run_path("job.py")
    card: unchecked

  - name: writes job.py then runs it as a Python subprocess
    code: |-
      open("job.py", "w").write('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})\n')
      import subprocess, sys
      subprocess.run([sys.executable, "job.py"], check=True)
    card: unchecked

  - name: writes job.py then imports it with importlib
    code: |-
      open("job.py", "w").write('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})\n')
      import importlib
      importlib.import_module("job")
    card: unchecked

  - name: literal pieces joined over three cells then exec compile
    earlier:
      - 'PARTS = {}'
      - 'PARTS[0] = ''import requests\n'''
      - 'PARTS[1] = ''requests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      SCRIPT = "".join(PARTS[i] for i in sorted(PARTS))
      exec(compile(SCRIPT, "job", "exec"), {"__name__": "__main__"})
    card: unchecked

  - name: base64 pieces appended to a list then decoded and exec compiled
    earlier:
      - 'CHUNKS = []'
      - 'CHUNKS.append("aW1wb3J0IHJlcXVlc3RzCnJlcXVlc3RzLnBvc3QoImh0dHBz")'
      - 'CHUNKS.append("Oi8vZXJwLmV4YW1wbGUudGVzdC9hcGkvb3JkZXJzIiwganNvbj17InF0eSI6IDF9KQ==")'
    code: |-
      import base64
      SCRIPT = base64.b64decode("".join(CHUNKS)).decode()
      exec(compile(SCRIPT, "job", "exec"))
    card: unchecked

  - name: a cursor delete inside exec of a script
    earlier:
      - 'SCRIPT = ''cur.execute("DELETE FROM orders WHERE qty = 0")'''
    code: |-
      import os, psycopg2
      conn = psycopg2.connect(host=os.environ['DS_POSTGRES_QA__HOST'])
      cur = conn.cursor()
      exec(SCRIPT)
    card: unchecked

  - name: a ninth literal exec holding the request after eight harmless ones
    code: |-
      exec("a = 1")
      exec("b = 2")
      exec("c = 3")
      exec("d = 4")
      exec("e = 5")
      exec("f = 6")
      exec("g = 7")
      exec("h = 8")
      exec('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: unchecked

  - name: the request five calls deep in earlier functions
    earlier:
      - |-
        import requests
        BASE = "https://erp.example.test/api"
        def _request(path, body):
            return requests.post(BASE + path, json=body)
        def post_order(o):
            return _request("/orders", o)
        def submit_batch(b):
            for o in b:
                post_order(o)
        def process(rows):
            submit_batch(rows)
        def main():
            process([{"qty": 1}])
    code: |-
      main()
    card: unchecked

  - name: the request four calls deep in earlier functions is read
    earlier:
      - |-
        import requests
        BASE = "https://erp.example.test/api"
        def _request(path, body):
            return requests.post(BASE + path, json=body)
        def post_order(o):
            return _request("/orders", o)
        def submit_batch(b):
            for o in b:
                post_order(o)
        def process(rows):
            submit_batch(rows)
    code: |-
      process([{"qty": 1}])
    card: read
    kinds: [http]

  # ── exec, eval and compile ────────────────────────────────────────────────
  # The source the builtin runs is a name, a build, a decode, a file read, a
  # parameter or the builtin loaded as a value: none of it is a literal the
  # check can read, so the cell is unchecked. The read and none rows here are
  # the controls beside them: a literal the check reads through another name
  # for the builtin or a function a literal exec defined, with the request or
  # with no write.

  - name: exec aliased by assignment then called with a literal
    code: |-
      run = exec
      run('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: unchecked

  - name: getattr of a computed builtins name then called
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      import builtins
      n = "ex" + "ec"
      getattr(builtins, n)(SCRIPT)
    card: unchecked

  - name: exec passed as a value to a helper
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      import functools
      functools.partial(exec, SCRIPT)()
    card: unchecked

  - name: exec of each item in a list
    code: |-
      PARTS = ['import requests\n', 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})']
      for p in PARTS:
          exec(p)
    card: unchecked

  - name: eval of a name bound to a harmless literal
    code: |-
      formula = "a * 2"
      a = 3
      print(eval(formula))
    card: unchecked

  - name: exec of a joined string
    code: |-
      PARTS = ['import requests\n', 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})']
      exec("".join(PARTS))
    card: unchecked

  - name: exec of two concatenated literals
    code: |-
      exec('import requests\n' + 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: unchecked

  - name: exec of an f-string with a filled hole
    code: |-
      host = "erp.example.test"
      exec(f'import requests\nrequests.post("https://{host}/api/orders", json={{"qty": 1}})')
    card: unchecked

  - name: exec of a format call
    code: |-
      exec('import requests\nrequests.post("https://{}/api/orders", json={{"qty": 1}})'.format("erp.example.test"))
    card: unchecked

  - name: exec of a file read
    files:
      job.py: |
        import requests
        requests.post("https://erp.example.test/api/orders", json={"qty": 1})
    code: |-
      exec(open("job.py").read())
    card: unchecked

  - name: exec of a code object bound in an earlier cell
    earlier:
      - 'code = compile(''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'', "job", "exec")'
    code: |-
      exec(code)
    card: unchecked

  - name: eval of a name bound in an earlier cell
    earlier:
      - 'E = ''__import__("requests").post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      eval(E)
    card: unchecked

  - name: exec of a function parameter in this cell
    code: |-
      def go(s):
          exec(s)
      go('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: unchecked

  - name: exec of a parameter in an earlier function
    earlier:
      - |-
        def go(s):
            exec(s)
    code: |-
      go('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: unchecked

  - name: exec of a decoded literal
    code: |-
      import base64
      exec(base64.b64decode("aW1wb3J0IHJlcXVlc3RzCnJlcXVlc3RzLnBvc3QoImh0dHBzOi8vZXJwLmV4YW1wbGUudGVzdC9hcGkvb3JkZXJzIiwganNvbj17InF0eSI6IDF9KQ=="))
    card: unchecked

  - name: exec held in a dict then called
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      RUNNERS = {"py": exec}
      RUNNERS["py"](SCRIPT)
    card: unchecked

  - name: a thread whose target is exec
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      import threading
      threading.Thread(target=exec, args=(SCRIPT,)).start()
    card: unchecked

  - name: an uncalled function that wraps exec of its parameter
    code: |-
      def run(src):
          exec(src)
      print("defined")
    card: unchecked

  - name: nested exec with no false sql block
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      exec("exec(SCRIPT)")
    card: unchecked
    not_kinds: [sql]

  - name: exec of a name holding exec text with no false sql block
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      q = "exec(SCRIPT)"
      exec(q)
    card: unchecked
    not_kinds: [sql]

  - name: exec compile of literal exec text with no false sql block
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      exec(compile("exec(SCRIPT)", "job", "exec"))
    card: unchecked
    not_kinds: [sql]

  - name: exec of a statement spliced in by repr keeps its sql
    code: |-
      import os, psycopg2
      conn = psycopg2.connect(host=os.environ['DS_POSTGRES_QA__HOST'])
      cur = conn.cursor()
      q = 'UPDATE orders SET status = 1 WHERE id = 42'
      exec('cur.execute(' + repr(q) + ')')
    card: unchecked
    kinds: [sql]

  - name: exec aliased in an earlier cell then called with a script
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
      - 'run = exec'
    code: |-
      run(SCRIPT)
    card: unchecked

  - name: exec held in a dict in an earlier cell then called
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
      - 'RUNNERS = {"py": exec}'
    code: |-
      RUNNERS["py"](SCRIPT)
    card: unchecked

  - name: an earlier function that returns exec
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
      - |-
        def runner():
            return exec
    code: |-
      runner()(SCRIPT)
    card: unchecked

  - name: an earlier function that maps eval over its parameter
    earlier:
      - |-
        def apply_all(xs):
            return list(map(eval, xs))
    code: |-
      apply_all(['__import__("requests").post("https://erp.example.test/api/orders", json={"qty": 1})'])
    card: unchecked

  - name: an earlier function with nine literal execs
    earlier:
      - |-
        def go():
            exec("a = 1")
            exec("b = 2")
            exec("c = 3")
            exec("d = 4")
            exec("e = 5")
            exec("f = 6")
            exec("g = 7")
            exec("h = 8")
            exec('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    code: |-
      go()
    card: unchecked

  - name: eval of a script beside a method named eval
    earlier:
      - 'E = ''__import__("requests").post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      class Model:
          def eval(self):
              return self
      eval(E)
    card: unchecked

  - name: a sort keyed by eval
    code: |-
      rows = ['__import__("requests").post("https://erp.example.test/api/orders", json={"qty": 1})']
      print(sorted(rows, key=eval))
    card: unchecked

  - name: exec of starred arguments
    code: |-
      args = ('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})',)
      exec(*args)
    card: unchecked

  - name: exec compile of keywords unpacked from a dict
    code: |-
      kw = {"source": 'import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})', "filename": "job", "mode": "exec"}
      exec(compile(**kw))
    card: unchecked

  - name: exec after a del of the name that shadowed it
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    code: |-
      exec = print
      del exec
      exec(SCRIPT)
    card: unchecked

  - name: literal exec that times a literal statement
    code: |-
      exec("import timeit\ntimeit.timeit('sum(range(3))')")
    card: none

  - name: literal exec that runs a literal through exec imported from builtins
    code: |-
      exec('from builtins import exec as run\nrun("x = 1")')
    card: none

  - name: a function a literal exec defined runs a nested literal exec
    earlier:
      - |-
        exec("def go():\n    exec('x = 1')")
    code: |-
      go()
    card: none

  - name: a function a literal exec defined runs python -c on a literal
    earlier:
      - |-
        exec("import subprocess\ndef go():\n    subprocess.run(['python3', '-c', 'print(1)'])")
    code: |-
      go()
    card: none

  - name: a function a literal exec defined evals a literal
    earlier:
      - |-
        exec("def go():\n    return eval('1 + 2')")
    code: |-
      go()
    card: none

  - name: literal exec with a star import after unread code ran
    earlier:
      - |-
        SCRIPT = 'import requests\ndef push():\n    requests.post("https://erp.example.test/api/orders", json={"qty": 1})\n'
      - |-
        exec(SCRIPT)
    code: |-
      exec('from math import *\nprint(sqrt(4))')
    card: none

  - name: exec rebound to itself, then handed a script
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    code: |-
      exec = exec
      exec(SCRIPT)
    card: unchecked

  - name: exec swapped into another name by a tuple assignment
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    code: |-
      exec, run = print, exec
      run(SCRIPT)
    card: unchecked

  - name: exec shadowed only under an if
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    code: |-
      import sys
      if len(sys.argv) > 5:
          exec = print
      exec(SCRIPT)
    card: unchecked

  - name: exec shadowed by an if-else whose other branch is exec
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    code: |-
      exec = print if len(SCRIPT) > 99 else exec
      exec(SCRIPT)
    card: unchecked

  - name: exec shadowed only under an if in an earlier cell
    earlier:
      - |-
        SCRIPT = open('job.py').read()
        if SCRIPT == 'x':
            exec = print
    code: |-
      exec(SCRIPT)
    card: unchecked

  - name: exec shadowed by the variable of a loop over an empty list
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    code: |-
      for exec in []:
          pass
      exec(SCRIPT)
    card: unchecked

  - name: exec shadowed by an import under try
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    code: |-
      try:
          from nothere import exec
      except ImportError:
          pass
      exec(SCRIPT)
    card: unchecked

  - name: a literal exec through the builtins module bound to its own name
    code: |-
      import importlib
      builtins = importlib.import_module('builtins')
      builtins.exec('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: read
    kinds: [http]

  - name: a literal exec through vars of the builtins module bound to its own name
    code: |-
      import importlib
      builtins = importlib.import_module('builtins')
      vars(builtins)['exec']('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: read
    kinds: [http]

  - name: exec of a script through the builtins module bound to its own name
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    files:
      job.py: |
        import requests
        requests.post('https://erp.example.test/api/orders', json={'qty': 1})
    code: |-
      builtins = __import__('builtins')
      builtins.exec(SCRIPT)
    card: unchecked

  - name: exec looked up by a computed name on the builtins module bound to its own name
    earlier:
      - |-
        SCRIPT = open('job.py').read()
    files:
      job.py: |
        import requests
        requests.post('https://erp.example.test/api/orders', json={'qty': 1})
    code: |-
      import importlib
      builtins = importlib.import_module('builtins')
      getattr(builtins, 'ex' + 'ec')(SCRIPT)
    card: unchecked

  - name: a compile after an import of re only under a branch
    earlier:
      - |-
        x = 1
    code: |-
      if x:
          from re import compile
      rx = compile(input())
    card: unchecked

  - name: a compile after an import of re in a try that may not have run
    code: |-
      try:
