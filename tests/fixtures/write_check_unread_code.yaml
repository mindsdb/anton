      rx = compile(input())
    card: unchecked

  - name: a call before a literal exec into globals defines the name, after unread code
    earlier:
      - |-
        exec(open('job.py').read())
    files:
      job.py: |
        import requests
        requests.post('https://erp.example.test/api/orders', json={'qty': 1})
    code: |-
      print(helper(3))
      exec('def helper(x):\n    return x * 2', globals())
