# The write check, cell by cell, when a cell runs code the check can't read.
# A missed run sends its request, write or delete with no Approve card; a
# false hold costs an unattended answer the whole card timeout. So each case
# here says what one cell does and the card the check raises for it.
#
# Each case has:
#   name     a short phrase saying what the cell does; the test's id.
#   earlier  the conversation's earlier cells, oldest first (optional). Each
#            is its code, for a cell that ran to its end, or a mapping:
#              code        its code.
#              errored     true for a cell that stopped on an error.
#              stopped_at  the line of its own code an errored cell stopped
#                          at, as the pad's boot reads it from the
#                          traceback; absent where the runtime doesn't say.
#              ended_process
#                          true for a cell whose process died, was killed
#                          or never ran it, so the pad starts a new one
#                          before the next cell.
#              code_files  what its own check read of each .py file it
#                          exec'd, {path: text}; the test records each
#                          text's SHA-256, as a cell does.
#   code     the cell the check runs before it runs for real.
#   files    project files that exist when the turn begins, {path: text}
#            (optional). The snapshot holds stock.csv besides these.
#   empty_project
#            true when the project folder is empty as the turn begins, so
#            the snapshot holds no file at all, not even stock.csv
#            (optional).
#   card     what the check raises:
#              unchecked  the check couldn't read code the cell runs, so it
#                         holds the cell and the card ends "This step can't
#                         be checked before it runs."
#              read       the check read the cell and holds it with the
#                         findings it read; `unchecked` is False.
#              none       the cell runs with no card.
#   kinds    the kinds the card must show besides `unchecked`, e.g. [http]
#            or [sql] (optional).
#   not_kinds
#            kinds the card must not show, e.g. [sql] (optional).
#
# The rule: the check reads literal code it can read; code the cell runs that
# the check can't read makes the cell unchecked; a cell that runs no unread
# code gets a card only for what the check reads in it. The HTTP rule below
# holds any POST to erp.example.test. "The request" throughout is
#   import requests
#   requests.post("https://erp.example.test/api/orders", json={"qty": 1})
#
# Read by tests/test_write_check.py::test_cells_that_run_code_the_check_cant_read,
# which builds a project snapshot in a temp dir (stock.csv, unless
# empty_project, plus `files`), runs find_cell_writes against it, and asserts
# the card named above.

rule: "POST https://erp.example.test/**"

cases:

  # ── Literal and unread code side by side, plus the four-deep control ──────
  # The first two are read; each of the eleven after them runs code the check
  # can't read, so it is unchecked. The last control stays read, since four
  # calls deep is within the read budget.

  - name: plain request written in the cell
    code: |-
      import requests
      requests.post("https://erp.example.test/api/orders", json={"qty": 1})
    card: read
    kinds: [http]

  - name: exec of a literal request
    code: |-
      exec('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: read
    kinds: [http]

  - name: exec compile of a script set in an earlier cell
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      exec(compile(SCRIPT, "job", "exec"))
    card: read
    kinds: [http]

  - name: exec of a script joined from two literals in the same cell
    code: |-
      SCRIPT = 'import requests\n' + 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})'
      exec(SCRIPT)
    card: read
    kinds: [http]

  - name: eval compile of a script
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      eval(compile(SCRIPT, "job", "exec"))
    card: read
    kinds: [http]

  - name: writes job.py then runs it with runpy
    code: |-
      open("job.py", "w").write('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})\n')
      import runpy
      runpy.run_path("job.py")
    card: unchecked

  - name: writes job.py then runs it as a Python subprocess
    code: |-
      open("job.py", "w").write('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})\n')
      import subprocess, sys
      subprocess.run([sys.executable, "job.py"], check=True)
    card: unchecked

  - name: writes job.py then imports it with importlib
    code: |-
      open("job.py", "w").write('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})\n')
      import importlib
      importlib.import_module("job")
    card: unchecked

  - name: literal pieces joined over three cells then exec compile
    earlier:
      - 'PARTS = {}'
      - 'PARTS[0] = ''import requests\n'''
      - 'PARTS[1] = ''requests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      SCRIPT = "".join(PARTS[i] for i in sorted(PARTS))
      exec(compile(SCRIPT, "job", "exec"), {"__name__": "__main__"})
    card: read
    kinds: [http]

  - name: base64 pieces appended to a list then decoded and exec compiled
    earlier:
      - 'CHUNKS = []'
      - 'CHUNKS.append("aW1wb3J0IHJlcXVlc3RzCnJlcXVlc3RzLnBvc3QoImh0dHBz")'
      - 'CHUNKS.append("Oi8vZXJwLmV4YW1wbGUudGVzdC9hcGkvb3JkZXJzIiwganNvbj17InF0eSI6IDF9KQ==")'
    code: |-
      import base64
      SCRIPT = base64.b64decode("".join(CHUNKS)).decode()
      exec(compile(SCRIPT, "job", "exec"))
    card: read
    kinds: [http]

  - name: a cursor delete inside exec of a script
    earlier:
      - 'SCRIPT = ''cur.execute("DELETE FROM orders WHERE qty = 0")'''
    code: |-
      import os, psycopg2
      conn = psycopg2.connect(host=os.environ['DS_POSTGRES_QA__HOST'])
      cur = conn.cursor()
      exec(SCRIPT)
    card: read
    kinds: [sql]

  - name: a ninth literal exec holding the request after eight harmless ones
    code: |-
      exec("a = 1")
      exec("b = 2")
      exec("c = 3")
      exec("d = 4")
      exec("e = 5")
      exec("f = 6")
      exec("g = 7")
      exec("h = 8")
      exec('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: unchecked

  - name: the request five calls deep in earlier functions
    earlier:
      - |-
        import requests
        BASE = "https://erp.example.test/api"
        def _request(path, body):
            return requests.post(BASE + path, json=body)
        def post_order(o):
            return _request("/orders", o)
        def submit_batch(b):
            for o in b:
                post_order(o)
        def process(rows):
            submit_batch(rows)
        def main():
            process([{"qty": 1}])
    code: |-
      main()
    card: unchecked

  - name: the request four calls deep in earlier functions is read
    earlier:
      - |-
        import requests
        BASE = "https://erp.example.test/api"
        def _request(path, body):
            return requests.post(BASE + path, json=body)
        def post_order(o):
            return _request("/orders", o)
        def submit_batch(b):
            for o in b:
                post_order(o)
        def process(rows):
            submit_batch(rows)
    code: |-
      process([{"qty": 1}])
    card: read
    kinds: [http]

  # ── exec, eval and compile ────────────────────────────────────────────────
  # The source the builtin runs is a name, a build, a decode, a file read, a
  # parameter or the builtin loaded as a value: none of it is a literal the
  # check can read, so the cell is unchecked. The read and none rows here are
  # the controls beside them: a literal the check reads through another name
  # for the builtin or a function a literal exec defined, with the request or
  # with no write.

  - name: exec aliased by assignment then called with a literal
    code: |-
      run = exec
      run('import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: unchecked

  - name: getattr of a computed builtins name then called
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      import builtins
      n = "ex" + "ec"
      getattr(builtins, n)(SCRIPT)
    card: unchecked

  - name: exec passed as a value to a helper
    earlier:
      - 'SCRIPT = ''import requests\nrequests.post("https://erp.example.test/api/orders", json={"qty": 1})'''
    code: |-
      import functools
      functools.partial(exec, SCRIPT)()
    card: unchecked

  - name: exec of each item in a list
    code: |-
      PARTS = ['import requests\n', 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})']
      for p in PARTS:
          exec(p)
    card: unchecked

  - name: eval of a name bound to a harmless literal
    code: |-
      formula = "a * 2"
      a = 3
      print(eval(formula))
    card: none

  - name: exec of a joined string
    code: |-
      PARTS = ['import requests\n', 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})']
      exec("".join(PARTS))
    card: read
    kinds: [http]

  - name: exec of two concatenated literals
    code: |-
      exec('import requests\n' + 'requests.post("https://erp.example.test/api/orders", json={"qty": 1})')
    card: read
    kinds: [http]

  - name: exec of an f-string with a filled hole
    code: |-
      host = "erp.example.test"
      exec(f'import requests\nrequests.post("https://{host}/api/orders", json={{"qty": 1}})')
    card: unchecked

  - name: exec of a format call
    code: |-
      exec('import requests\nrequests.post("https://{}/api/orders", json={{"qty": 1}})'.format("erp.example.test"))
    card: unchecked

  - name: exec of a py file read by a literal path is read like a literal
    files:
      job.py: |
        import requests
        requests.post("https://erp.example.test/api/orders", json={"qty": 1})
    code: |-
      exec(open("job.py").read())
    card: read
    kinds: [http]

  - name: exec of a py file with no write runs with no card
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    code: |-
      exec(open('helpers.py').read())
    card: none

  - name: exec of a py file through Path read_text runs with no card
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    code: |-
      from pathlib import Path
      exec(Path('helpers.py').read_text())
    card: none

  - name: exec of a compile of a py file runs with no card
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    code: |-
      exec(compile(open('helpers.py').read(), 'helpers.py', 'exec'))
    card: none

  - name: a read of what a py file an earlier exec read made runs with no card
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    earlier:
      - code: exec(open('helpers.py').read())
        code_files:
          helpers.py: |
            import pandas as pd
            def load_orders():
                return pd.DataFrame({"qty": [1, 2]})
      - orders = load_orders()
    code: |-
      print(orders.mean())
      print(orders["qty"].sum())
    card: none

  - name: a copy of what a py file an earlier exec read made runs with no card
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    earlier:
      - import pandas as pd
      - code: exec(open('helpers.py').read())
        code_files:
          helpers.py: |
            import pandas as pd
            def load_orders():
                return pd.DataFrame({"qty": [1, 2]})
      - df = load_orders()
    code: |-
      print(pd.DataFrame(df).describe())
    card: none

  - name: a call to a write a py file an earlier exec read defined is held
    files:
      push.py: |
        import requests
        def push():
            requests.post("https://erp.example.test/api/orders", json={"qty": 1})
    earlier:
      - code: exec(open('push.py').read())
        code_files:
          push.py: |
            import requests
            def push():
                requests.post("https://erp.example.test/api/orders", json={"qty": 1})
    code: |-
      push()
    card: read
    kinds: [http]

  - name: an earlier exec of a py file whose file changed since leaves what it made unread
    files:
      push.py: |
        def push():
            pass
    earlier:
      - code: exec(open('push.py').read())
        code_files:
          push.py: |
            import requests
            def push():
                requests.post("https://erp.example.test/api/orders", json={"qty": 1})
    code: |-
      push()
    card: unchecked

  - name: an earlier exec of a py file its own check didn't read leaves what it made unread
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    earlier:
      - exec(open('helpers.py').read())
      - orders = load_orders()
    code: |-
      print(orders.mean())
    card: unchecked

  - name: exec of a py file the cell overwrites first is unchecked
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    code: |-
      open('helpers.py', 'w').write('x = 1')
      exec(open('helpers.py').read())
    card: unchecked

  - name: exec of a py file in a loop that overwrites it is unchecked
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    code: |-
      for i in range(2):
          exec(open('helpers.py').read())
          open('helpers.py', 'w').write('x = 1')
    card: unchecked

  - name: exec of a py file after a call to an earlier function that writes it is unchecked
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    earlier:
      - |-
        def save(text):
            open('helpers.py', 'w').write(text)
    code: |-
      save('x = 1')
      exec(open('helpers.py').read())
    card: unchecked

  - name: exec of a py file after a write the check can't place is unchecked
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    code: |-
      import sys
      open(sys.argv[0], 'w').write('x = 1')
      exec(open('helpers.py').read())
    card: unchecked

  - name: exec of a py file by a relative path once a cell changed folder is unchecked
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
      sub/helpers.py: x = 1
    earlier:
      - import os; os.chdir('sub')
    code: |-
      exec(open('helpers.py').read())
    card: unchecked

  - name: exec of a py file that isn't there is unchecked
    code: |-
      exec(open('missing.py').read())
    card: unchecked

  - name: exec of a file that isn't a py file is unchecked
    files:
      job.txt: x = 1
    code: |-
      exec(open('job.txt').read())
    card: unchecked

  - name: exec of a py file inside a function is unchecked
    files:
      helpers.py: |
        import pandas as pd
        def load_orders():
            return pd.DataFrame({"qty": [1, 2]})
    code: |-
      def setup():
          exec(open('helpers.py').read())
      setup()
    card: unchecked


  - name: exec of a py file opened with another encoding is unchecked
    files:
      h.py: x = 1
    code: |-
      exec(open('h.py', encoding='utf-7').read())
    card: unchecked

  - name: exec of a py file opened in binary is unchecked
    files:
      h.py: x = 1
    code: |-
      exec(open('h.py', 'rb').read())
    card: unchecked

  - name: exec of a py file opened through an opener is unchecked
    files:
      h.py: x = 1
    code: |-
      import os
      exec(open('h.py', opener=lambda p, f: os.open('other.py', f)).read())
    card: unchecked

  - name: exec of a py file after an earlier cell rebound open is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        import io
        open = lambda *a, **k: io.StringIO("")
    code: |-
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file after literal code rebound open is unchecked
    files:
      h.py: x = 1
    code: |-
      exec("open = lambda *a: None")
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file read through a rebound Path is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        from pathlib import Path
        Path.read_text = lambda self: ""
    code: |-
      exec(Path('h.py').read_text())
    card: unchecked

  - name: exec of a py file after an import of a module in the pad's folder is unchecked
    files:
      h.py: x = 1
      w.py: x = 2
    code: |-
      import w
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file after a cell changed folder by descriptor is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        import os
        os.fchdir(os.open('/tmp', os.O_RDONLY))
    code: |-
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file after a cell started a background process is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        import subprocess
        subprocess.Popen('sleep 5; cp other.py h.py', shell=True)
    code: |-
      exec(open('h.py').read())
    card: unchecked

  - name: pieces a function defined before the list adds are unchecked
    earlier:
      - "def more():\n    PARTS.append('import requests\\nrequests.post(\"https://erp.example.test/api/orders\", json={\"qty\": 1})\\n')"
      - "PARTS = ['x = 1\\n']"
      - more()
    code: |-
      exec("".join(PARTS))
    card: unchecked

  - name: pieces added through a frame's globals are unchecked
    earlier:
      - "PARTS = ['x = 1\\n']"
    code: |-
      import sys
      sys._getframe().f_globals['PARTS'].append('import requests\nrequests.post(\"https://erp.example.test/api/orders\", json={\"qty\": 1})\n')
      exec("".join(PARTS))
    card: unchecked

  - name: a script read through a rebound builtin is unchecked
    earlier:
      - "str = lambda x: 'import requests\\nrequests.post(\"https://erp.example.test/api/orders\", json={\"qty\": 1})\\n'"
    code: |-
      exec(str('x = 1'))
    card: unchecked

  - name: a script decoded through a patched module is unchecked
    earlier:
      - import base64
      - "base64.b64decode = lambda s: b'import requests\\nrequests.post(\"https://erp.example.test/api/orders\", json={\"qty\": 1})\\n'"
    code: |-
      exec(base64.b64decode('eCA9IDE='))
    card: unchecked

  - name: a script after a star import is unchecked
    earlier:
      - "PARTS = ['x = 1\\n']"
      - from string import *
    code: |-
      exec("".join(PARTS))
    card: unchecked

  - name: a script after literal code run through an alias of exec is unchecked
    earlier:
      - "PARTS = ['x = 1\\n']"
      - e = exec
    code: |-
      exec("".join(PARTS))
    card: unchecked

  - name: exec of a py file after an earlier import of an installed package runs with no card
    files:
      h.py: x = 1
    earlier:
      - import pandas as pd
    code: |-
      exec(open('h.py').read())
    card: none

  - name: exec of a py file after an earlier literal exec runs with no card
    files:
      h.py: x = 1
    earlier:
      - exec('z = 3')
    code: |-
      exec(open('h.py').read())
    card: none

  - name: exec of a py file after a literal import of a module in the pad's folder is unchecked
    files:
      h.py: x = 1
      w.py: x = 2
    code: |-
      import importlib
      importlib.import_module('w')
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file after a call into a module in the pad's folder is unchecked
    files:
      h.py: x = 1
      w.py: "def g():\n    pass\n"
    earlier:
      - import w
    code: |-
      w.g()
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file after a folder change through an alias is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        import os
        f = os.chdir
        f('/tmp')
    code: |-
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file after a lookup by a computed name is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        import os
        getattr(os, 'ch' + 'dir')('/tmp')
    code: |-
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file by a path that climbs out of a folder is unchecked
    files:
      h.py: x = 1
      sub/k.py: x = 2
    code: |-
      exec(open('sub/../h.py').read())
    card: unchecked

  - name: exec of a py file after a thread started through an alias is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        import threading
        T = threading.Thread
        T(target=print).start()
    code: |-
      exec(open('h.py').read())
    card: unchecked

  - name: pieces the garbage collector reaches are unchecked
    earlier:
      - "PARTS = ['x = 1\\n']"
      - |-
        import gc
        [o for o in gc.get_objects() if o == ['x = 1\n']][0].append('import requests\nrequests.post(\"https://erp.example.test/api/orders\", json={\"qty\": 1})\n')
    code: |-
      exec("".join(PARTS))
    card: unchecked

  - name: pieces after a call into a module in the pad's folder are unchecked
    files:
      w.py: "def g():\n    pass\n"
    earlier:
      - "PARTS = ['x = 1\\n']"
      - import w
    code: |-
      w.g()
      exec("".join(PARTS))
    card: unchecked

  - name: exec of a py file after imports and literal assignments in the cell runs with no card
    files:
      h.py: x = 1
    code: |-
      import pandas as pd
      LIMIT = 10
      exec(open('h.py').read())
    card: none

  - name: exec of a py file after any other statement in the cell is unchecked
    files:
      h.py: x = 1
    code: |-
      import logging
      logging.basicConfig(filename='h.py', filemode='w', format='%(message)s')
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file after an earlier cell patched open through mock is unchecked
    files:
      h.py: x = 1
    earlier:
      - |-
        from unittest import mock
        mock.patch('builtins.open', mock.mock_open(read_data='x = 2')).start()
    code: |-
      exec(open('h.py').read())
    card: unchecked

  - name: exec of a py file by an absolute path outside the pad's folder is unchecked
    code: |-
      exec(open('/etc/hosts.py').read())
    card: unchecked

